{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>{% block title %}Admin | EduVillage{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/admin.css' %}">
</head>
<body>

<div class="container-fluid">
    <div class="row">

        <!-- Sidebar -->
        <nav class="col-md-2 sidebar bg-dark text-white p-3">
            <h4>EduVillage</h4>
            <small>Admin Panel</small>
            <hr>
            <a href="{% url 'dashboard_admin' %}" class="text-white d-block mb-2">Dashboard</a>
            <a href="{% url 'admin_students' %}" class="text-white d-block mb-2">Students</a>
            <a href="{% url 'admin_instructors' %}" class="text-white d-block mb-2">Instructors</a>
            <a href="{% url 'admin_courses' %}" class="text-white d-block mb-2">Courses</a>
            <a href="{% url 'admin_reports' %}" class="text-white d-block mb-2">Reports</a>

            <hr>
            <form method="POST" action="{% url 'logout' %}">
    {% csrf_token %}
    <button class="btn btn-danger btn-sm">Logout</button>
</form>

        </nav>

        <!-- Main content -->
        <main class="col-md-10 p-4">
            {% block content %}{% endblock %}
        </main>

    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
