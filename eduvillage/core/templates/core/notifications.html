{% extends 'core/base_instructor.html' %}

{% block content %}

<div class="container mt-4">

<h3 class="mb-3">🔔 Notifications</h3>

<div class="card shadow p-3">

{% if notifications %}

<ul class="list-group">

{% for note in notifications %}

<li class="list-group-item">
{{ note }}
</li>

{% endfor %}

</ul>

{% else %}

<p>No notifications.</p>

{% endif %}

</div>

</div>

{% endblock %}
