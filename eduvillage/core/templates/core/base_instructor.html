{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Instructor | EduVillage</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/dashboard.css' %}?v=2">

</head>

<body>

<!-- Top Bar -->
<div class="container-fluid bg-light px-4 py-2 d-flex justify-content-between align-items-center">
  <h4 class="mb-0">EduVillage – Instructor</h4>
  <div>
    <a href="{% url 'notifications' %}" class="btn btn-outline-primary btn-sm">Notifications</a>
    <a href="{% url 'profile' %}" class="btn btn-outline-secondary btn-sm">Profile</a>
    <a href="{% url 'logout' %}" class="btn btn-danger btn-sm">Logout</a>
  </div>
</div>

<div class="container-fluid">
  <div class="row">

    <!-- Sidebar -->
    <aside class="col-md-3 sidebar d-none d-md-block">
      <div class="list-group list-group-flush">
        <a href="{% url 'dashboard_instructor' %}"
           class="list-group-item list-group-item-action {% if request.resolver_match.url_name == 'dashboard_instructor' %}active{% endif %}">
           Dashboard
        </a>

        <a href="{% url 'my_courses' %}"
           class="list-group-item list-group-item-action {% if request.resolver_match.url_name == 'my_courses' %}active{% endif %}">
           My Courses
        </a>

        <a href="{% url 'student_attendance' %}"
           class="list-group-item list-group-item-action {% if request.resolver_match.url_name == 'student_attendance' %}active{% endif %}">
           Student Attendance
        </a>

        <a href="{% url 'assignments' %}"
           class="list-group-item list-group-item-action {% if request.resolver_match.url_name == 'assignments' %}active{% endif %}">
           Tests & Assignments
        </a>

        <a href="{% url 'calendar' %}"
           class="list-group-item list-group-item-action {% if request.resolver_match.url_name == 'calendar' %}active{% endif %}">
           Calendar
        </a>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="col-md-9 p-4">
      {% block content %}{% endblock %}
    </main>

  </div>
</div>

</body>
</html>
