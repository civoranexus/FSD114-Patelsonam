{% extends 'core/base_admin.html' %}

{% block title %}Reports | EduVillage Admin{% endblock %}

{% block content %}
<h2 class="mb-4">📊 Reports</h2>

<div class="row">
    <div class="col-md-4">
        <div class="card shadow-sm mb-3">
            <div class="card-body">
                <h5>Total Students</h5>
                <p class="display-6">{{ total_students }}</p>
            </div>
        </div>
    </div>

    <div class="col-md-4">
        <div class="card shadow-sm mb-3">
            <div class="card-body">
                <h5>Total Instructors</h5>
                <p class="display-6">{{ total_instructors }}</p>
            </div>
        </div>
    </div>

    <div class="col-md-4">
        <div class="card shadow-sm mb-3">
            <div class="card-body">
                <h5>Total Courses</h5>
                <p class="display-6">{{ total_courses }}</p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
